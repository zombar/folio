name: folio

services:
  backend:
    build: ./backend
    ports:
      - "8010:8010"
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
      - ./backend:/app
      - ./models:/app/models
    environment:
      - COMFYUI_URL=${COMFYUI_URL:-http://localhost:8188}
      - STORAGE_PATH=/app/storage
      - DATABASE_URL=sqlite:///./data/folio.db
      - MODELS_PATH=/app/models
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010", "--reload"]

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8010
    depends_on:
      - backend
