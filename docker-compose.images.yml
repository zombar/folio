# Docker Compose override file for using pre-built images from ghcr.io
# Usage: docker compose -f docker-compose.yml -f docker-compose.images.yml up -d
# Or use Makefile: make up-images

name: folio

services:
  backend:
    image: ghcr.io/zombar/folio/backend:latest
    pull_policy: always

  frontend:
    image: ghcr.io/zombar/folio/frontend:latest
    pull_policy: always
